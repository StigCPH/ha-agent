name: Release HA
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Reviewed tag matching the manifest version
        required: true
        type: string
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Verify identity
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          test "${{ github.repository }}" = "StigCPH/ha-agent"
          test "${{ github.ref_name }}" = "main"
          git merge-base --is-ancestor HEAD origin/main
          test "$(git describe --tags --exact-match)" = "$RELEASE_TAG"
      - run: python -m pip install -r requirements.test.txt
      - run: python -m pytest --tb=short -v
      - name: Build release
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: python scripts/build_release.py --tag "$RELEASE_TAG"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: gh release create "$RELEASE_TAG" dist/ha_agent.zip dist/SHA256SUMS --verify-tag --title "HA $RELEASE_TAG" --notes-file RELEASE_NOTES.md
